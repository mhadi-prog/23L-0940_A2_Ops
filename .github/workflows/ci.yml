name: CI
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pandas ruff
      - name: Lint
        run: ruff check src app tests --select E9,F63,F7,F82
      - name: Test
        run: pytest -q
      - name: Build Docker image
        run: docker build -t visionguard:ci .