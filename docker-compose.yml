services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visionguard
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d visionguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no "ports:" on purpose: reachable only from the web service

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/visionguard
      MODEL_PATH: /models/champion.keras
      THRESHOLD: ${THRESHOLD:-0.5}
      MAX_UPLOAD_MB: "5"
    volumes:
      - ./models:/models:ro
    ports:
      - "5001:5001"

volumes:
  pgdata: